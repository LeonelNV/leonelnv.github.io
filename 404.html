<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página no encontrada — Leonel Navarro Valades</title>
  <meta name="description" content="La página que buscas no existe." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232453a6'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3ELN%3C/text%3E%3C/svg%3E" />

  <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <!-- GitHub Pages sirve esta página en cualquier ruta: todas las rutas son absolutas. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    .notfound {
      max-width: 560px;
      margin: 64px auto 0;
      padding: 48px 40px;
      text-align: center;
    }
    .notfound .notfound-code {
      margin-top: 0;
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--accent);
    }
    .notfound h1 {
      margin-top: 16px;
      font-size: 22px;
      font-weight: 700;
    }
    .notfound p {
      margin-top: 8px;
      color: var(--text-2);
    }
    .notfound .btn {
      margin-top: 24px;
    }
    @media (max-width: 600px) {
      .notfound { margin-top: 32px; padding: 36px 20px; }
    }
  </style>
  <script>
    window.I18N_EN = {
      "meta.title": "Page not found — Leonel Navarro Valades",
      "meta.description": "The page you are looking for does not exist.",
      "nf.title": "Page not found",
      "nf.text": "The page you are looking for does not exist or has moved.",
      "nf.home": "Go to home page",
    };
  </script>
  <script src="/assets/js/common.js" defer></script>
</head>
<body class="has-header">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.1-1.3-.3-2.5-1-3.5.3-1.1.3-2.4 0-3.5 0 0-1 0-3 1.5a10.4 10.4 0 0 0-6 0C8 2 7 2 7 2c-.3 1.1-.3 2.4 0 3.5A5.4 5.4 0 0 0 6 9c0 3.5 3 5.5 6 5.5-.4.5-.7 1-.8 1.6-.2.6-.3 1.2-.2 1.9v4"/><path d="M9 18c-4.5 2-5-2-7-2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  </svg>

  <header class="site-header">
    <div class="site-header-inner">
      <nav class="site-nav" aria-label="Navegación principal" data-i18n-attr="aria-label:nav.main">
        <ul>
          <li><a href="/" data-i18n="nav.home">Inicio</a></li>
          <li><a href="/#proyectos" data-i18n="nav.projects">Proyectos</a></li>
          <li><a href="/cv/" data-i18n="nav.cv">CV</a></li>
          <li><a href="https://github.com/LeonelNV" target="_blank" rel="noopener" aria-label="GitHub"><svg class="icon" aria-hidden="true"><use href="#i-github"/></svg><span class="nav-label-optional">GitHub</span></a></li>
        </ul>
      </nav>
      <div class="site-tools">
        <button type="button" class="tb-btn" id="lang-toggle" aria-label="Switch to English">EN</button>
        <button type="button" class="tb-btn tb-icon" id="theme-toggle" aria-label="Cambiar tema">
          <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
          <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="card notfound" aria-labelledby="nf-title">
      <p class="notfound-code">404</p>
      <h1 id="nf-title" data-i18n="nf.title">Página no encontrada</h1>
      <p data-i18n="nf.text">La página que buscas no existe o cambió de lugar.</p>
      <a class="btn btn-primary" href="/" data-i18n="nf.home">Ir al inicio</a>
    </section>
  </main>

</body>
</html>
